{% extends "base.html" %}
{% block page_heading %}System Error (500){% endblock %}
{% block content %}
<div class="card card-clean p-5 text-center my-4">
    <h1 class="display-5 text-warning fw-bold"><i class="bi bi-bug"></i> 500 Server Error</h1>

</div>
{% endblock %}
